name: Robin

on:
  # ── 自动触发链路 ──
  # pull_request_target → bootstrap 发 /review 评论（需 PAT 才能触发 issue_comment）
  # issue_comment → review 执行真实审查（携带 secrets）
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ① 引导：PR 建立/重开时，用 PAT 在 PR 下代发 /review 评论，触发 ② 的 issue_comment 链路。
  #    ⚠️ 必须用 PAT（GH_PAT secret）而非 github.token——GITHUB_TOKEN 发出的评论不会触发
  #    issue_comment 事件（GitHub 安全机制），导致 review job 永远不跑。
  bootstrap:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Ask robin to review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret 未配置，跳过自动审查。添加 PAT（repo scope）到仓库 Secrets 即可启用。"
            exit 0
          fi
          # 去重：检查是否已存在 /review 评论
          existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" \
            --jq '[.[]|select(.user.login=="github-actions[bot]" and (.body|startswith("/review")))]|length')
          if [ "$existing" -eq 0 ]; then
            gh pr comment "$NUMBER" --repo "$REPO" --body "/review"
            echo "Posted /review comment via PAT"
          else
            echo "Bootstrap comment already present, skipping"
          fi

  # ② 秘钥探测：LLM 三件套配置齐全才继续
  config-check:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          _BASE: ${{ secrets.LLM_BASE_URL }}
        run: |
          if [ -n "$_BASE" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "configured=false" >> "$GITHUB_OUTPUT"; fi

  # ③ 真实审查：允许维护者手动命令与 github-actions[bot] 自动命令
  review:
    needs: config-check
    if: >-
      needs.config-check.outputs.configured == 'true' &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/robin')
      ) &&
      (
        github.event.comment.user.login == 'github-actions[bot]' ||
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Robin review
        uses: antongulin/robin@v2.7.2
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
