name: Robin

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write

# secrets 不能直接用于 job.if，经 workflow 级 env 中转判断
env:
  LLM_CONFIGURED: ${{ secrets.LLM_BASE_URL != '' }}

jobs:
  review:
    # 哪个仓库配齐了 LLM secrets 就在哪里运行；未配置则显示跳过而非失败
    if: env.LLM_CONFIGURED == 'true'
    uses: antongulin/robin/.github/workflows/review.yml@main
    with:
      review-on-synchronize: true
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
