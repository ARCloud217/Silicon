block.silicon-signal-jammer.name=Signal Jammer
block.silicon-signal-jammer.description=Broadcasts jamming noise on a channel (1-5 or ALL); jam strength fades by distance like signal strength. Signal minus jam strength - when the difference is <= 0 that spot is jammed (no signal in the H overlay).
