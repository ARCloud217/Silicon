block.silicon-item-transfer-hub.description=[accent]零缓冲物流中枢[]——跨网络全自动物品调度；自身不库存、绝不过量运输。\n\n[lightgray]> 连线[]\n范围内连接生产、存储、核心、炮台与其他[accent]中枢[]（最多 20 条连线）。\n[accent]放置 / 双击[]：1) 优先连接范围内所有中枢；2) 再连接这些中枢网络外的附近建筑。已被其他中枢服务的建筑不会被抢走——绿色方块表示"符合条件但未连线"，蓝色方块+线条表示"将被连接"。点击已连线目标可切换；双击自身清空全部。\n\n[lightgray]> 拉取 · 供应[]\n按消耗匹配的预算为工厂/炮台供料：实际用量加少量缓冲。\n取料顺序：[accent]存储 > 核心 > 矿机/工厂产出[]。任何建筑的配方原料都不会被取走。\n\n[lightgray]> 推送 · 溢出[]\n输出达 75% 时抽干：优先推入有真实空间的核心，否则改道最近存储。存储溢出（>=90%）或核心库存偏低（<75%）时回流核心。[orange]真正满的核心绝不接收物品——任何物品都不会被焚毁[]。\n\n[lightgray]> 电力[]\n每件物品经过每个中枢消耗[accent]10 电力[]；空闲零耗电。需求分摊到 30 帧，不会对电网造成尖峰。[orange]电力不足的中枢完全停转并冷却[]后重试；路由自动避开停机中枢。\n\n[lightgray]> 统计[]\n电力 = 最近一秒实际耗电；速率 = 最近 10 秒经过该中枢的物品数。稳态负载下，电力 ≈ 10 × 速率。跨中枢传输按每跳计费一次。
