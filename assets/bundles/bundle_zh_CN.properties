block.silicon-item-transfer-hub.name=物品传输中枢
block.silicon-item-transfer-hub.description=[accent]零缓冲物流中枢[] —— 自动调度网络内的物品流动，不囤货、不过量搬运。\n\n[lightgray]» 连接[]\n与范围内的生产建筑、仓库、核心、炮台及其它[accent]中枢[]建立链路（上限 20 条）。\n[accent]放置 / 双击[]：① 先全部连接范围内的中枢（就近优先）；② 再就近连接「已选中枢网络之外」的空闲建筑。已被其它中枢覆盖的建筑不会被抢占——预览中显示为绿色方框，蓝色方框 + 连线才是实际会放下的连接。单击已连目标可切换断连，双击自身清空全部连接。\n\n[lightgray]» 拉取 · 供料[]\n按「消耗匹配」预算为工厂 / 炮台补充原料：只补真实消耗量 + 少量缓冲。\n取货顺序：[accent]仓库 → 核心 → 矿机/工厂产出[]；任何建筑的配方原料都不会被抽走。\n\n[lightgray]» 推送 · 回流[]\n矿机/工厂产出达 75% 即排空：[accent]核心未满即推[]，已满则改投最近仓库；仓库单物品 ≥90% 溢出、或核心存量低于 75% 时回收至核心。[orange]核心真实存满时绝不强送——杜绝物品被焚烧丢弃[]。\n\n[lightgray]» 电力[]\n每件物品每经过一个中枢消耗 [accent]10 电力[]，无传输零功耗。瞬时需求经 30 帧平滑摊平，电网侧无耗电锋；[orange]电力不足时完全停止搬运并进入冷却[]，供电恢复后自动重试；路径规划自动绕开无电中枢。\n\n[lightgray]» 统计[]\n耗电 = 最近 1 秒实际取电量；速率 = 最近 10 秒途经本枢物品均值。稳态下 耗电 ≈ 10 × 速率。跨枢运输时每个枢纽各计自己的一跳费用。
